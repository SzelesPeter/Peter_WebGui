[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peter-webgui"
version = "0.1.0"
description = "A universal web GUI (NiceGUI) for embedded projects and instrument automation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "nicegui>=3.0",
    "pandas",
    "numpy",
    "pyserial>=3.5",
]

[project.optional-dependencies]
ksp = ["krpc"]
usb = ["pyusb"]
dev = ["pytest", "build", "twine"]

[project.scripts]
hp34401a-gui = "peter_webgui.apps.hp34401a_gui:main"
hp34970a-gui = "peter_webgui.apps.hp34970a_gui:main"
multipage-demo = "peter_webgui.apps.multipage_demo:main"
delta-v1 = "peter_webgui.apps.delta_v1:main"

[tool.setuptools.packages.find]
where = ["src"]
